[project]
name = "workflowx-configurator"
version = "2.1.13"
description = "WorkflowX bundles ComfyUI configuration profile nodes with XFlows workflow management, XPrompts prompt libraries, XNodes reusable node snippets, and the JsonX prompt system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyworld>=0.3.5", "numpy>=1.25.0", "scipy", "colour-science>=0.4", "ultralytics>=8.3", "segment-anything>=1.0", "opencv-python>=4.8", "spandrel>=0.4", "hydra-core>=1.3.2", "iopath>=0.1.10"]
classifiers = [
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/haroonaslam/WorkflowX-Configurator"
Documentation = "https://github.com/haroonaslam/WorkflowX-Configurator#readme"
"Bug Tracker" = "https://github.com/haroonaslam/WorkflowX-Configurator/issues"

[tool.comfy]
PublisherId = "haxzero"
DisplayName = "WorkflowX Configurator"
Banner = "https://raw.githubusercontent.com/haroonaslam/WorkflowX-Configurator/main/docs/images/workflowx-banner-v4.png"

[project.optional-dependencies]
auk = ["transformers>=5.3,<6", "safetensors", "PyYAML", "tqdm"]
